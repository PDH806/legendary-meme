# 네이션스리그 리그 A 결과를 1시간마다 위키백과에서 받아 반영해요
# 바뀐 게 있으면 저장소에 저장하고, Cloudflare가 그걸 보고 사이트를 다시 올려요
# 스크립트가 실패(위키 훼손, 결과 불일치 등)하면 이 작업이 실패로 표시되고 GitHub가 메일로 알려줘요
name: 경기 결과 반영

on:
  schedule:
    - cron: '5 * * * *'   # 매시 5분 (GitHub 사정으로 몇 분 늦게 돌 수 있어요)
  workflow_dispatch:       # Actions 화면에서 직접 실행하는 버튼

permissions:
  contents: write

concurrency:
  group: kleague-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 네이션스리그 결과 받기
        id: unl
        continue-on-error: true
        run: php tools/update_unl.php

      - name: 바뀐 데이터 저장
        run: |
          if git diff --quiet -- public; then
            echo "바뀐 것 없음"
          else
            git config user.name "cup-results-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/unl2026a.js public/nations.html
            git commit -m "경기 결과 자동 반영"
            git push
          fi

      - name: 실패한 스크립트 알리기
        if: steps.unl.outcome == 'failure'
        run: |
          echo "네이션스리그: ${{ steps.unl.outcome }}"
          exit 1
